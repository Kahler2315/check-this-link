name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned extension tooling
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run Mozilla linter
        run: npm run lint

      - name: Build unsigned package
        run: npm run build

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: check-this-link-unsigned
          path: artifacts/*.zip
          if-no-files-found: error
