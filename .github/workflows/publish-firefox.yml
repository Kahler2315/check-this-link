name: Publish to Firefox Add-ons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    environment: firefox-addons
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned extension tooling
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run Mozilla linter
        run: npm run lint

      - name: Build submitted package
        run: npm run build

      - name: Submit listed update to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir extension
          --artifacts-dir artifacts
          --channel listed
          --amo-metadata amo-metadata.json
          --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"

      - name: Upload submitted source package
        uses: actions/upload-artifact@v4
        with:
          name: check-this-link-submitted-source
          path: artifacts/*.zip
          if-no-files-found: error

